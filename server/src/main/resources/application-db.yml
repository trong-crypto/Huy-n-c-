spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 8
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 5
  flyway:
    enabled: true

